<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Trending Topics - Organized Viral Content</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 2026 Trending Topics</h1>
            <p>Organized viral content and growth trends from around the world</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="news">🔥 Viral Now</button>
            <button class="tab-btn" data-tab="reddit">📱 Reddit Hot</button>
            <button class="tab-btn" data-tab="hackernews">💻 Tech Buzz</button>
            <button class="tab-btn" data-tab="search">📈 Growth Trends</button>
        </div>

        <div class="content">
            <div id="news" class="tab-content active">
                <div class="loading">Loading viral trends...</div>
                <div class="trends-list"></div>
            </div>
            
            <div id="reddit" class="tab-content">
                <div class="loading">Loading Reddit hot topics...</div>
                <div class="trends-list"></div>
            </div>
            
            <div id="hackernews" class="tab-content">
                <div class="loading">Loading tech buzz...</div>
                <div class="trends-list"></div>
            </div>
            
            <div id="search" class="tab-content">
                <div class="loading">Loading growth trends...</div>
                <div class="trends-list"></div>
            </div>
        </div>

        <footer>
            <p>Real trending data from January 2026 • Updated with current viral content</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
