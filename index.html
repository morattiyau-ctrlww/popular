<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trending Topics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Global Trending Topics</h1>
            <p>Real-time trending topics from around the world</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="news">� Most Hit</button>
            <button class="tab-btn" data-tab="reddit">🔥 Reddit</button>
            <button class="tab-btn" data-tab="hackernews">💻 Tech</button>
        </div>

        <div class="content">
            <div id="news" class="tab-content active">
                <div class="loading">Loading most hit topics...</div>
                <div class="trends-list"></div>
            </div>
            
            <div id="reddit" class="tab-content">
                <div class="loading">Loading Reddit trends...</div>
                <div class="trends-list"></div>
            </div>
            
            <div id="hackernews" class="tab-content">
                <div class="loading">Loading tech trends...</div>
                <div class="trends-list"></div>
            </div>
        </div>

        <footer>
            <p>Data refreshed every 30 minutes • No API keys required</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
